name: SAP HANA qualification
on:
  pull_request:
    branches: [master, "codex/**"]
    paths:
      - ".github/workflows/hana-qualification.yml"
      - ".github/qualification/Hana/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hana-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hana:
    name: Qualify actual SAP HANA engine and .NET driver
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Start disposable HANA Express
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w fs.file-max=20000000 fs.aio-max-nr=262144 vm.memory_failure_early_kill=1 vm.max_map_count=135217728
          mkdir -p "$RUNNER_TEMP/hana"
          printf '{"master_password":"MgT9ci7Q4xZ2"}' > "$RUNNER_TEMP/hana/password.json"
          sudo chown -R 12000:79 "$RUNNER_TEMP/hana"
          sudo chmod 600 "$RUNNER_TEMP/hana/password.json"
          docker pull saplabs/hanaexpress:2.00.088.00.20251110.1
          docker run -d --name migrator-hana --hostname hxe -p 39041:39041 \
            --ulimit nofile=1048576:1048576 \
            --sysctl kernel.shmmax=1073741824 --sysctl kernel.shmmni=524288 --sysctl kernel.shmall=8388608 \
            --sysctl net.ipv4.ip_local_port_range="40000 60999" \
            -v "$RUNNER_TEMP/hana:/hana/mounts" \
            saplabs/hanaexpress:2.00.088.00.20251110.1 \
            --passwords-url file:///hana/mounts/password.json --agree-to-sap-license
          for attempt in $(seq 1 180); do
            if docker exec migrator-hana /usr/sap/HXE/HDB90/exe/hdbsql -i 90 -d HXE -u SYSTEM -p MgT9ci7Q4xZ2 'SELECT 1 FROM DUMMY' >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' migrator-hana)" != true ]; then
              docker logs migrator-hana
              exit 1
            fi
            sleep 5
          done
          docker logs migrator-hana
          exit 1
      - name: Test actual engine through SAP .NET driver
        env:
          MIGRATOR_HANA: "Server=localhost:39041;UserID=SYSTEM;Password=MgT9ci7Q4xZ2"
        run: dotnet run --project .github/qualification/Hana/Hana.csproj
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p TestResults
          docker logs migrator-hana > TestResults/hana.log 2>&1 || true
          free -m > TestResults/memory.txt
          df -h > TestResults/disk.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hana-qualification
          path: TestResults/
      - name: Cleanup
        if: always()
        run: docker rm -fv migrator-hana || true
