name: .NET Pull Request
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        database: [Unit, SQLite, SQLServer, PostgreSQL, Oracle, MySQL, MariaDB, Firebird, Db2, Informix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Start database
        run: bash .github/scripts/start-database.sh "${{ matrix.database }}"
        timeout-minutes: 15
      - name: Build
        run: dotnet build Migrator.slnx -p:LiveDatabase=${{ matrix.database }}
      - name: Test
        shell: pwsh
        run: ./.github/scripts/test.ps1 -Database ${{ matrix.database }}
      - name: Collect database logs
        if: always()
        run: |
          mkdir -p TestResults
          if docker inspect migrator-db >/dev/null 2>&1; then
            docker logs migrator-db > TestResults/database.log 2>&1
            docker inspect migrator-db > TestResults/container.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.database }}
          path: TestResults/
          if-no-files-found: error
      - name: Remove test container
        if: always()
        run: |
          if docker inspect migrator-db >/dev/null 2>&1; then
            docker rm -fv migrator-db
          fi
